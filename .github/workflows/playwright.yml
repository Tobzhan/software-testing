name: Playwright Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: assignments/sis2-playwright

jobs:
  test:
    name: Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: assignments/sis2-playwright/package-lock.json

      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        env:
          BASE_URL: ${{ vars.BASE_URL }}
        run: |
          set -a
          source ./.env.example
          set +a
          npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: blob-report-${{ matrix.shard }}
          path: assignments/sis2-playwright/blob-report/
          retention-days: 1
          overwrite: true

      - name: Upload shard results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ matrix.shard }}
          path: |
            assignments/sis2-playwright/test-results/
            assignments/sis2-playwright/reports/junit.xml
          retention-days: 14
          overwrite: true

  merge-reports:
    name: Merge reports
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: assignments/sis2-playwright/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Download blob reports
        uses: actions/download-artifact@v5
        with:
          pattern: blob-report-*
          path: assignments/sis2-playwright/all-blob-reports/
          merge-multiple: true
      - name: Merge reports into HTML and JUnit
        run: npx playwright merge-reports --config=merge.config.ts all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: assignments/sis2-playwright/playwright-report/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Upload merged JUnit report
        uses: actions/upload-artifact@v5
        with:
          name: junit-report
          path: assignments/sis2-playwright/reports/junit-merged.xml
          if-no-files-found: error
          retention-days: 14
          overwrite: true
